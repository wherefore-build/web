# THE COMPANY'S CORPUS, judged on every push by the engine release it pins:
# every file accounted for and every generated one current, every fact reaching
# what a visitor receives, the site reaching nothing outside itself, the brand
# said once and readable, every control on it doing something when a thumb
# presses it - and each of those shown to fail.
#
# TWO JOBS SIDE BY SIDE, SO A RUN IS AS LONG AS ITS LONGEST HALF, NOT THE SUM
# (owner, 6 November 2026). `corpus` runs every check; `proofs` plants each
# check's fault and requires the check to fail, which takes longest and used
# to run after everything else. The proofs run only when something that
# decides what a check does has moved - a check, a generator, the brand's
# source, this workflow, wherefore.json. A push that only moves the pin, the
# facts, the skill's copies or the pages they make changes no check's
# behaviour, and the engine's own proofs cover the engine; `proofs` says it
# was skipped and why. The browser is cached between runs by the file that
# pins it.
#
# The engine is the release requirements-engine.txt pins, from PyPI, so the
# install needs no secret. It is installed into the checkout, never into the
# runner's Python, so a moved pin is always the engine that runs.
#
# One check reads the network: `wherefore check upstream` asks the pendulum's
# public site whether the model the case study copied is still what it serves,
# and fails when the pendulum has moved, until the copy is taken again. So a
# deploy never ships a copy of something that has changed. It is asked when the
# site is compiled, and only then, never on a timer: the owner's call.
#
# THEN IT DEPLOYS what those checks passed, and nothing else: `deploy` needs
# `corpus`, and `proofs` when they ran. main goes to the site's address; every other branch to a preview
# of its own, whose address is posted on its pull request. Cloudflare builds
# nothing, so what it serves is the tree that was judged.
name: corpus

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WHAT MOVED decides whether the proofs run. The push's parent is compared
  # with its head; a new branch, a dispatch or a force has no parent here and
  # runs everything.
  moved:
    runs-on: ubuntu-latest
    outputs:
      prove: ${{ steps.what.outputs.prove }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Did anything that decides what a check does move?
        id: what
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != push ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "prove=yes" >> "$GITHUB_OUTPUT"; echo "no parent to compare with: every proof runs"; exit 0
          fi
          # On a branch, compare with where it left main: a push that moves only
          # pages after one that moved a check must still run the proofs.
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
            git fetch --quiet origin "${{ github.event.repository.default_branch }}"
            BEFORE=$(git merge-base "origin/${{ github.event.repository.default_branch }}" "$GITHUB_SHA")
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "$CHANGED"
          # Everything but the pin, the facts, the skill's copies and the pages they make.
          if printf '%s\n' "$CHANGED" | grep -Ev '^(requirements-engine\.txt|facts/|site/|\.claude/|\.agents/)' | grep -q .; then
            echo "prove=yes" >> "$GITHUB_OUTPUT"; echo "a check, a generator, the brand, the workflow or wherefore.json moved: every proof runs"
          else
            echo "prove=no" >> "$GITHUB_OUTPUT"; echo "only the pin, the facts, the skill's copies or the pages moved: no check's behaviour did, so the proofs are not run"
          fi

  # `corpus` keeps its name: it is the status check main requires before a merge.
  corpus:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/.wherefore-engine:${{ github.workspace }}/.browser
    steps:
      - uses: actions/checkout@v7
      - name: Install the engine this corpus pins
        id: install
        run: |
          rm -rf .wherefore-engine
          python3 -m pip install --quiet --no-deps --target .wherefore-engine -r requirements-engine.txt
      - name: Every file is accounted for, and every generated one is what its sources make
        run: python3 -m wherefore gate
      - name: Every fact reaches what a visitor receives
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 -m wherefore check reach
      - name: What the case study copied from the pendulum is still what the pendulum's site serves
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 -m wherefore check upstream
      - name: The case study's snapshot says when it was counted, and each count reaches the page
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 checks/case_study.py
      - name: The site loads nothing from elsewhere, and every link on it goes somewhere
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 checks/self_contained.py
      - name: Nothing on the site tells a visitor to install somebody else's package
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 checks/install_line.py
      - name: The one-line installer installs the pinned release, whichever tool is there
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 checks/install_script.py
      - name: The brand is said once, and every text colour is readable on its ground
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python3 -m wherefore check palette
          python3 checks/one_palette.py
          python3 checks/contrast.py
          python3 checks/brand_reasons.py
      # The press check drives a real browser, pinned in
      # requirements-browser.txt and installed into the checkout like the
      # engine; `playwright install` fetches the Chromium build that pin asks for.
      - name: The browser, from the cache when its pin has not moved
        uses: actions/cache@v4
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-browser.txt') }}
      - name: Install the browser the press check drives
        id: browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          rm -rf .browser
          python3 -m pip install --quiet --target .browser -r requirements-browser.txt
          python3 -m playwright install --with-deps chromium
      - name: Every control on the site does something a visitor sees, pressed cold on a phone
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: python3 checks/controls_press.py
      - name: The pendulum's model stands beside the case study's heading, and turns under a thumb
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: python3 checks/model_turns.py
      - name: The questions turn by themselves, and stop on the chip a thumb taps
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: python3 checks/questions_turn.py
      - name: Every page fits a phone's width, moving or still, and no icon outgrows its words
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: python3 checks/fits_phone.py
      - name: Every feature has its clip, and the features page plays it
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 checks/motion_for_every_feature.py
      - name: Every clip fits a portrait frame and a landscape one at every scene, and every scene shows its words
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: python3 checks/motion_fits.py

  # EACH CHECK SHOWN TO FAIL, beside the checks rather than after them. Needs
  # the same engine and browser, in its own checkout: the proofs plant faults
  # in the tree and put them back, and two in one checkout would corrupt each
  # other.
  proofs:
    needs: moved
    if: needs.moved.outputs.prove == 'yes'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/.wherefore-engine:${{ github.workspace }}/.browser
    steps:
      - uses: actions/checkout@v7
      - name: Install the engine this corpus pins
        run: |
          rm -rf .wherefore-engine
          python3 -m pip install --quiet --no-deps --target .wherefore-engine -r requirements-engine.txt
      - name: The browser, from the cache when its pin has not moved
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-browser.txt') }}
      - name: Install the browser the proofs drive
        run: |
          rm -rf .browser
          python3 -m pip install --quiet --target .browser -r requirements-browser.txt
          python3 -m playwright install --with-deps chromium
      - name: And each of those fails when it should
        run: python3 -m wherefore prove

  # Cloudflare's own Git builds are disconnected: this is the one deploy, and it
  # waits for every check above. CLOUDFLARE_API_TOKEN is a token made from
  # Cloudflare's "Edit Cloudflare Workers" template, saved as a secret of this
  # repository (README.md, "Hosting"). wrangler is pinned, like the engine, so
  # the deploy is the same program every time.
  deploy:
    needs: [corpus, proofs]
    # The proofs may have been skipped for a push that moved no check; a deploy
    # waits for the checks either way, and for the proofs when they ran.
    if: ${{ !cancelled() && needs.corpus.result == 'success' && (needs.proofs.result == 'success' || needs.proofs.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      WRANGLER: wrangler@4.154.0
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Deploy main, or preview this branch
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not a secret of this repository, so nothing can be deployed. README.md, under Hosting, says how to add it."
            exit 1
          fi
          if [ "$BRANCH" = main ]; then
            npx --yes "$WRANGLER" deploy
          else
            # Cloudflare names a preview after its branch, in lower case, with
            # every run of other characters made one hyphen.
            NAME=$(printf '%s' "$BRANCH" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
            # `wrangler preview` does not apply wrangler.jsonc's workers_dev and
            # preview_urls; only main's `wrangler deploy` does. Apply them first.
            python3 .github/scripts/cloudflare_urls.py
            npx --yes "$WRANGLER" preview --name "$NAME"
          fi
          python3 .github/scripts/deployed.py "$WRANGLER_OUTPUT_FILE_PATH"
      - name: The deployed site sends the policies site/_headers says
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: python3 .github/scripts/served_headers.py "$URL"
      - name: Say where the preview is, on the pull request
        if: github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No open pull request for $BRANCH - the address is in this run's summary."
            exit 0
          fi
          MARK='<!-- wherefore-preview -->'
          BODY=$(printf '%s\n**Preview** - %s - `%s`\n\nDeployed from this commit after every check passed, with nothing built on Cloudflare'"'"'s side, so it is the site the checks judged. A newer push replaces this address'"'"'s contents and this line.\n' "$MARK" "$URL" "${GITHUB_SHA::7}")
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARK\")) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -f body="$BODY" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$BODY" > /dev/null
          fi
