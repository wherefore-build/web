# THE CASE STUDY'S COUNTS, FROM THE PENDULUM. facts/pendulum.json is a copy of
# chaotic-pendulums-co's docs/case-study.json, which the pendulum's own build
# counts. Once a day, and whenever it is run by hand, this reads that file at
# the pendulum's main (.github/scripts/case_study.py). When the counts differ
# from the copy's, it writes the copy again, stamped with the commit it read,
# regenerates the site, and opens a draft pull request from the branch
# case-study/update - or updates the one already open. corpus.yml judges and
# previews it like any other branch.
#
# IT NEVER MERGES. The owner reads the preview and decides, as for every other
# change to the page.
#
# TWO SECRETS, because a fine-grained token's permissions apply to every
# repository it selects, and the pendulum is to be read and never written:
#   PENDULUM_READ_TOKEN  Contents: read on zakholdsworth/chaotic-pendulums-co
#                        alone. The pendulum is private.
#   CASE_STUDY_TOKEN     Contents, Pull requests and Actions: read and write on
#                        zakholdsworth/wherefore-co alone. A branch pushed or a
#                        pull request opened with this workflow's own
#                        GITHUB_TOKEN would run no checks and get no preview.
# Until both exist the run fails at its first step, in those words (README.md,
# "The case study").
name: case-study

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: case-study
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      BRANCH: case-study/update
    steps:
      - name: The tokens that read the pendulum and write here are secrets of this repository
        env:
          READ: ${{ secrets.PENDULUM_READ_TOKEN }}
          WRITE: ${{ secrets.CASE_STUDY_TOKEN }}
        run: |
          if [ -z "$READ" ] || [ -z "$WRITE" ]; then
            [ -n "$READ" ] || echo "::error::PENDULUM_READ_TOKEN is not a secret of this repository, so the pendulum's counts cannot be read."
            [ -n "$WRITE" ] || echo "::error::CASE_STUDY_TOKEN is not a secret of this repository, so a pull request could not run its checks."
            echo "README.md, under The case study, says what each is and how to add it."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CASE_STUDY_TOKEN }}
      - name: Read the pendulum's counts at its main
        id: read
        env:
          GH_TOKEN: ${{ secrets.PENDULUM_READ_TOKEN }}
        run: python3 .github/scripts/case_study.py
      - name: Install the engine this corpus pins
        if: steps.read.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.WHEREFORE_READ_TOKEN }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.WHEREFORE_READ_TOKEN }}@github.com/zakholdsworth/wherefore.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/zakholdsworth/wherefore
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::WHEREFORE_READ_TOKEN is not a secret of this repository, so the site cannot be regenerated. README.md, under CI, says how to add it."
            exit 1
          fi
          python3 -m pip install --quiet --no-deps --target .wherefore-engine -r requirements-engine.txt
      - name: Regenerate the site from the new counts
        if: steps.read.outputs.changed == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/.wherefore-engine
        run: |
          cd gen
          python3 brand.py
          python3 site.py
      - name: Open the pull request, or update the one open
        if: steps.read.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CASE_STUDY_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add facts/pendulum.json site
          git commit -q -m "The case study's counts move with the pendulum" \
            -m "Read by .github/workflows/case-study.yml from $(python3 -c 'import json; c = json.load(open("facts/pendulum.json"))["captured"]; print(c["from"] + " at " + c["commit"][:8] + ", " + c["on"])')."
          # This branch is the workflow's own, rebuilt from main on every run.
          git push --force origin "$BRANCH"
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            echo "Updated #$PR."
            exit 0
          fi
          gh pr create --draft --base main --head "$BRANCH" \
            --title "The case study's counts move with the pendulum" \
            --body "The pendulum's own count of itself (chaotic-pendulums-co, docs/case-study.json) has moved, so the case study's numbers move with it. Read and opened by .github/workflows/case-study.yml, which never merges: check the preview, and merge when it reads right."
          # The push above ran before this pull request existed, so the preview
          # had nowhere to post its address. Run the checks once more, now it does.
          gh workflow run corpus.yml --ref "$BRANCH"
