<style>
:root{--paper:#F4F5F7;--ink:#15181C;--card:#FFFFFF;--rule:#D3D7DC;--mute:#5D6673;--accent:#335993}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:14px/1.5 ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  transition:color .9s linear}
header h1,.sub,button{transition:background-color .9s linear,color .9s linear,
  border-color .9s linear}
#shL :not(g),#shR :not(g){transition:fill .9s linear,stroke .9s linear}
#sheets.notrans *{transition:none!important}
header{width:100%;max-width:1060px;padding:20px 20px 0;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
h1{font-size:19px;margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:12.5px;margin:0}
#stage{width:100%;max-width:1060px;padding:8px 12px 0;position:relative;
  overflow:hidden}
body.dk{background:#15181C}
body.dk header h1{color:#E8EAED}
body.dk .sub{color:#8B94A0}
body.dk button{background:#1C2127;color:#C8CDD4;border-color:#39414B}
body.dk button.on{background:#E8EAED;color:#15181C;border-color:#E8EAED}
#cv{transition:opacity .45s linear}
body.mob #stage{max-width:412px;box-shadow:0 0 0 1px var(--rule);
  border-radius:18px;padding-bottom:8px}
#stgbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  display:none;z-index:3;width:min(560px,calc(100% - 48px));box-sizing:border-box;
  padding:9px 14px 3px;background:var(--card);border:1px solid var(--rule);border-radius:5px;
  font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;
  color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;
  cursor:ew-resize;
  transition:background-color .9s linear,color .9s linear,border-color .9s linear}
#stgbar.on{display:block}
#stghead{display:flex;align-items:center;gap:8px;white-space:nowrap;height:24px}
#stgname{overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
#stgbar .stgb{position:relative;flex:0 0 auto;width:30px;height:24px;padding:0;margin:0;
  display:inline-flex;align-items:center;justify-content:center;border-radius:4px;
  background:var(--card);color:var(--ink);border:1px solid var(--rule);cursor:pointer;
  letter-spacing:0;font:inherit;transition:background-color .15s linear,color .15s linear,border-color .15s linear}
#stgbar .stgb::after{content:'';position:absolute;left:-5px;right:-5px;top:-10px;bottom:-10px}
#stgbar .stgb[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
body.dk #stgbar .stgb,#stgbar.dk .stgb{background:#1C2026;color:#E8EAED;border-color:#39414B}
body.dk #stgbar .stgb[aria-pressed="true"],#stgbar.dk .stgb[aria-pressed="true"]{
  background:#E8EAED;color:#15181C;border-color:#E8EAED}
#stgof{color:var(--mute);font-weight:400}
#stgbar .stgend{display:none;width:auto;padding:0 7px;font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.1em}
#stgbar.end .stgend{display:inline-flex}
#stgbar.end #stgof,#stgbar.end #stgpar,#stgbar.end #stgzoom{display:none}
#stgscale{position:relative;height:34px;margin:2px 22px 0;outline:none}
#stgbar:focus-within{box-shadow:0 0 0 2px var(--accent)}
#stgscale .rl,#stgscale .dn{position:absolute;left:0;top:15px;height:1px;background:var(--rule)}
#stgscale .rl{right:0}
#stgscale .dn{height:2px;top:14px;background:var(--ink);width:0}
#stgscale .tk{position:absolute;top:10px;width:1px;height:11px;margin-left:-.5px;background:var(--mute)}
#stgscale .tk.mn{top:13px;height:5px;opacity:.55}
#stgscale .lb{position:absolute;top:25px;transform:translateX(-50%);white-space:nowrap;
  font:400 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;color:var(--mute)}
#stgscale .lb.on{color:var(--ink);font-weight:700}
#stgscale .nd{position:absolute;top:5px;width:2px;height:18px;margin-left:-1px;background:var(--ink)}
body.dk #stgbar,#stgbar.dk{color:#E8EAED;background:#1C2026;border-color:#2C323A}
body.dk #stgscale .rl,#stgbar.dk #stgscale .rl{background:#39414B}
body.dk #stgscale .dn,body.dk #stgscale .nd,#stgbar.dk #stgscale .dn,#stgbar.dk #stgscale .nd{background:#E8EAED}
body.dk #stgscale .tk,body.dk #stgscale .lb,body.dk #stgof,#stgbar.dk #stgscale .tk,#stgbar.dk #stgscale .lb,#stgbar.dk #stgof{color:#8B94A0}
body.dk #stgscale .tk,#stgbar.dk #stgscale .tk{background:#8B94A0}
body.dk #stgscale .lb.on,#stgbar.dk #stgscale .lb.on{color:#E8EAED}
#sheets{position:absolute;inset:0;display:none;opacity:0;transition:opacity .45s linear;pointer-events:none}
#sheets svg{width:100%;height:100%;display:block}
canvas{width:100%;height:auto;display:block;border-radius:12px;cursor:grab;touch-action:none;background:transparent}
canvas:active{cursor:grabbing}
.bar{display:flex;gap:8px;align-items:center;justify-content:center;padding:12px 0 28px;flex-wrap:wrap}
button{font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;
  color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:5px;
  padding:10px 14px;cursor:pointer}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:600px){
  header{padding:12px 14px 0}
  header .sub{display:none}
  .bar{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;width:100%;
    padding:8px 12px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    scroll-padding:0 12px}
  .bar::-webkit-scrollbar{display:none}
  .bar>*{flex:0 0 auto}
  .bar+.bar{padding-bottom:8px}
  #objrev{display:none}
  #clinfo{margin:4px 12px 0!important}
  body.clon #tcb,body.clon #tca,body.clon #tcg{order:-1}
}
</style>

var ACC={"part-clamp-bar":{kind:"comb",cut:406.4,count:6,steps:[["stock", "Stock", "The bar as it arrives: rolled faces, and more width than any part needs."], ["cut", "Cut", "A 16″ strip is sawn off the bar. All 6 clamp bars come out of this one strip."], ["brush", "Brush", "Brushed while it is still a blank: the brushed face is the finish, so nothing is cut into it yet."], ["op1", "Op 1", "Op 1, the strip face up, held by the spine along its far edge. Each bar's three holes are drilled and tapped, and the two cross holes chamfered at the mouth; then the cutter runs round each bar - its two sides, its rounded free end, and across its plate end - leaving it joined to the spine by two small tabs, and a corner-rounding cutter follows it round once more, rounding the outboard edge along both sides and the free end. The 6 bars hang off the spine like the teeth of a comb."], ["op2", "Op 2", "Op 2, the comb turned on its edge in the vise, the spine on top and the bars hanging down: their outboard faces against the fixed jaw, their free ends resting on a parallel. The cutter mills the spine away from above, down through the tabs, and faces each bar's plate end square, 1-5/16″ from the free end the parallel holds. Then, still in the vise, each plate end's two #8-32 UNC-2B end taps are drilled and tapped straight down into it, 0.18″ from the outboard face, and each mouth chamfered, so the end seats flat on the plate."], ["anodize", "Anodize", "Anodized black: one lot with part-mounting-plate, part-rear-fork, part-front-fork, part-beam-lower-half and part-beam-upper-half, part-rear-fork the color master, judged by eye against a retained chip, with no dE gate."]]},"part-beam-lower-half":{kind:"beam",cut:207.9625,count:1,top:-182.5625,bot:-385.7625,holes:[[-12.7,-347.6625],[12.7,-347.6625],[-12.7,-334.9625],[12.7,-334.9625],[-12.7,-322.2625],[12.7,-322.2625],[-12.7,-309.5625],[12.7,-309.5625],[-12.7,-296.8625],[12.7,-296.8625],[-12.7,-284.1625],[12.7,-284.1625],[-12.7,-365.9187],[12.7,-365.9187],[-12.7,-195.2625],[12.7,-195.2625],[-12.7,-228.7905],[12.7,-228.7905]],joint:[[-12.7,-195.2625],[12.7,-195.2625],[-12.7,-228.7905],[12.7,-228.7905]],bk:[[-12.7,-365.9187],[12.7,-365.9187]],rt:0,band:0,steps:[["stock", "Stock", "The bar as it arrives: rolled faces, and more width than any part needs."], ["cut", "Cut", "Parted from the bar long, so the profile has ends to take back."], ["brush", "Brush", "Brushed while it is still a blank: the brushed face is the finish, so nothing is cut into it yet."], ["op1", "Op 1", "The holes the clamp bar bolts to, plain, so one screw length serves from either face. The two holes the bracket bar's screws come through, countersunk so the heads sit below the face. The four threads at the seam end that the screws through the joint plate go into. Each tapped hole's front mouth chamfered, so the thread starts clean. The outline is cut, and the bar becomes the part. Corners rounded by the same pass that takes the width down. A small break round the front face, so no edge is sharp."], ["anodize", "Anodize", "Anodized black: one lot with part-mounting-plate, part-rear-fork, part-front-fork, part-clamp-bar and part-beam-upper-half, part-rear-fork the color master, judged by eye against a retained chip, with no dE gate."]]},"part-beam-upper-half":{kind:"beam",cut:207.9625,count:1,top:20.6375,bot:-182.5625,holes:[[0,0],[-12.7,-136.3345],[12.7,-136.3345],[-12.7,-169.8625],[12.7,-169.8625]],joint:[[-12.7,-136.3345],[12.7,-136.3345],[-12.7,-169.8625],[12.7,-169.8625]],bk:[],rt:1,band:1,steps:[["stock", "Stock", "The bar as it arrives: rolled faces, and more width than any part needs."], ["cut", "Cut", "Parted from the bar long, so the profile has ends to take back."], ["brush", "Brush", "Brushed while it is still a blank: the brushed face is the finish, so nothing is cut into it yet."], ["op1", "Op 1", "The four threads at the seam end that the screws through the joint plate go into. Each tapped hole's front mouth chamfered, so the thread starts clean. The hole the pivot thread is cut into. Its mouth opened, so the tap enters straight. The pivot thread is cut. The band the engraving goes into is faced flat first, so every letter is carved to the same depth. Milled into the front face before the color and anodized over, so it reads as a change of texture rather than of color. The outline is cut, and the bar becomes the part. Corners rounded by the same pass that takes the width down. A small break round the front face, so no edge is sharp."], ["anodize", "Anodize", "Anodized black: one lot with part-mounting-plate, part-rear-fork, part-front-fork, part-clamp-bar and part-beam-lower-half, part-rear-fork the color master, judged by eye against a retained chip, with no dE gate."]]}};

    bar.setAttribute('style','position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(760px,calc(100vw - 32px));'+
      'background:var(--card,#fff);border:1px solid var(--rule,#ccd);border-radius:8px;padding:12px 16px;'+
      'font:500 11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink,#111);z-index:20;box-sizing:border-box');
    bar.innerHTML='<div style="display:flex;align-items:center;gap:10px"><b id="accstep" style="letter-spacing:.12em"></b>'+
      '<span id="accpart" style="color:var(--mute,#667);letter-spacing:.08em"></span>'+
      '<button id="accspeed" type="button" aria-label="Playback speed" style="margin-left:auto;font:700 11px ui-monospace,monospace;padding:6px 10px;border:1px solid var(--rule,#ccd);border-radius:5px;background:var(--card,#fff);color:var(--ink,#111);cursor:pointer">1\u00d7</button>'+
      '<button id="accplay" type="button" style="font:700 11px ui-monospace,monospace;padding:6px 12px;border:1px solid var(--rule,#ccd);border-radius:5px;background:var(--card,#fff);color:var(--ink,#111);cursor:pointer">PLAY</button></div>'+
      '<p id="accwords" style="margin:6px 0 8px;font:400 12.5px/1.45 system-ui,sans-serif;color:var(--ink,#111)"></p>'+
      '<input id="accrange" type="range" min="0" step="0.01" style="width:100%" aria-label="Where the making is">'+
      '<div id="accticks" style="display:flex;justify-content:space-between;letter-spacing:.08em;color:var(--mute,#667)"></div>';
    document.body.appendChild(bar);
    var rg=bar.querySelector('#accrange');
    rg.addEventListener('input',function(){accStop();CP.made(ACCM.pn,+rg.value)});
    bar.querySelector('#accplay').addEventListener('click',function(){ACC_PLAY?accStop():accPlay()});
    bar.querySelector('#accspeed').addEventListener('click',function(){
      ACC_SPEED=ACC_SPEED>0.9?0.5:ACC_SPEED>0.4?0.25:1; accUI()});
  }
  bar.hidden=false;
  var A=ACC[ACCM.pn], s=Math.min(A.steps.length-1,Math.round(ACCM.t)), st=A.steps[Math.min(A.steps.length-1,Math.ceil(ACCM.t-1e-6))];
  bar.querySelector('#accstep').textContent=st[1].toUpperCase();
  bar.querySelector('#accpart').textContent=ACCM.pn+' \u00b7 '+(A.kind==='comb'?'CLAMP BAR':(ACCM.pn==='part-beam-lower-half'?'BEAM, LOWER HALF':'BEAM, UPPER HALF'));
  bar.querySelector('#accwords').textContent=st[2];
  var rg2=bar.querySelector('#accrange'); rg2.max=A.steps.length-1; rg2.value=ACCM.t;
  var tk=bar.querySelector('#accticks');
  if(tk.childElementCount!==A.steps.length)tk.innerHTML=A.steps.map(function(x,i){
    return '<button type="button" data-i="'+i+'" style="font:600 10px ui-monospace,monospace;letter-spacing:.08em;background:none;border:0;color:inherit;cursor:pointer;padding:8px 2px">'+x[1].toUpperCase()+'</button>'}).join('');
  [].forEach.call(tk.children,function(b,i){b.style.color=(i===s?'var(--ink,#111)':'');
    b.onclick=function(){accStop();if(i===0){CP.made(ACCM.pn,0);return} CP.made(ACCM.pn,i-1);accPlay(i)}});
  bar.querySelector('#accspeed').textContent=ACC_SPEED>0.9?'1\u00d7':ACC_SPEED>0.4?'\u00bd\u00d7':'\u00bc\u00d7';
  bar.querySelector('#accplay').textContent=ACC_PLAY?'PAUSE':(ACCM.t>=A.steps.length-1?'REPLAY':'PLAY');
}
function accStop(){ACC_PLAY=null;accUI()}
var ACC_SPEED=1;
function accDur(A,id){
  var comb=A.kind==='comb';
  return ({stock:2200,cut:2600,brush:2400,op1:comb?2800*A.count:9000,op2:comb?18000:7000,anodize:3200})[id]||3000;
}
function accPlay(until){
  var A=ACC[ACCM.pn], n=A.steps.length-1, end=Math.min(n,until===undefined?n:until);
  if(ACCM.t>=end)ACCM.t=until===undefined?0:end-1;
  var tok={}, last=performance.now(); ACC_PLAY=tok; accUI();
  (function step(){if(ACC_PLAY!==tok||!ACCM)return;
    var now=performance.now(), dt=Math.min(100,now-last); last=now;
    var k=Math.min(n,Math.max(1,Math.ceil(ACCM.t+1e-9)));
    ACCM.t=Math.min(end,ACCM.t+dt*ACC_SPEED/accDur(A,A.steps[k][0])); accFrame(); draw(); accUI();
    if(ACCM.t<end)requestAnimationFrame(step); else{ACC_PLAY=null;accUI()}})();
}
function accView(){
  var A=ACC[ACCM.pn], base=ACC_CAM[ACCM.pn], t=ACCM.t, ids=A.steps.map(function(x){return x[0]});
  var at=function(id){var i=ids.indexOf(id);return i<0?1:Math.max(0,Math.min(1,t-(i-1)))};
  var r=cv.getBoundingClientRect(), bar=document.getElementById('accbar'), c=0;
  if(bar&&!bar.hidden&&r.height>0){var b=bar.getBoundingClientRect();c=Math.max(0,Math.min(0.6,(r.bottom-b.top)/r.height))}
  var asp=Math.max(0.3,r.width/Math.max(1,r.height)), wC=0, fx=0;
  var W0=A.cut+40, H0=90, W1=W0, H1=H0;
  if(A.kind==='comb'){
    var n=A.count, Ls=A.cut, gap=(Ls-n*W)/(n+1), pit=W+gap, bx=function(f){return -Ls/2+gap+W/2+Math.max(0,Math.min(n-1,f))*pit};
    var dwell=function(v){var i=Math.floor(v), u=v-i;
      return i+(u<0.08?-0.5+0.5*sm(u/0.08):u>0.92?0.5*sm((u-0.92)/0.08):0)};
    var e1=at('op1'), e2=at('op2');
    W1=1.75*pit; H1=150;
    if(e1>0&&e1<1){wC=sm(e1/0.04)*(1-sm((e1-0.96)/0.04)); fx=bx(dwell(e1*n))}
    else if(e2>0&&e2<1){
      wC=sm((e2-0.08)/0.04)*(1-sm((e2-0.88)/0.04));
      var xc=-Ls/2-12+(Ls+24)*sm((e2-0.1)/0.38);
      if(e2<0.48)fx=Math.max(bx(0),Math.min(bx(n-1),xc));
      else if(e2<0.52)fx=bx(n-1)+(bx(0)-bx(n-1))*sm((e2-0.48)/0.04);
      else fx=bx(dwell((e2-0.52)/0.36*n))}
  }
  var aO=Math.max(base.app,H0/(1-c),W0*1.1/asp), aC=Math.max(H1/(1-c),W1/asp), app=aO*Math.pow(aC/aO,wC);
  var pt=(cam.pitch||base.pitch)*Math.PI/180;
  return {yaw:base.yaw,pitch:base.pitch,fov:base.fov,tx:fx*wC,ty:base.ty-(app*c/2)/Math.max(0.3,Math.cos(pt)),
          app:app,t1:base.t1,t2:base.t2};
}
function accFrame(){if(!ACCM)return; var v=accView(); view.tx=v.tx; view.ty=v.ty; view.app=v.app}
CP.wall=function(on){WALL_ON=!!on; draw(); return WALL_ON};
CP.made=function(pn,t){
  if(pn===null){ACCM=null;accStop();accUI();draw();return null}
  if(pn===undefined)return ACCM&&{pn:ACCM.pn,t:ACCM.t};
  if(!ACC[pn])throw new Error('CP.made: "'+pn+'" has no making of its own - it is one of '+Object.keys(ACC).join(', '));
  var first=!ACCM||ACCM.pn!==pn, n=ACC[pn].steps.length-1;
  ACCM={pn:pn,t:Math.max(0,Math.min(n,t===undefined?0:+t))};
  accUI();
  if(first){CLAMP_ON=false;CP.go({view:accView(),style:'lit',explode:0,dur:1})}
  else accFrame();
  draw(); accUI();
  var st=ACC[pn].steps[Math.min(n,Math.ceil(ACCM.t-1e-6))];
  return {pn:pn,t:ACCM.t,step:st[0],words:st[2]};
};
(function(){
  if(!ONLY)return;
  if(STG_MADE.indexOf(ONLY)<0){ONLY=null;return}
  ['stgbar','sheets','clinfo'].forEach(function(id){
    var e=document.getElementById(id); if(e)e.style.display='none'});
  CP.making.tools(false); CP.partLabels(false); CP.grab(false);
  Promise.resolve(CP.making(5,{solo:ONLY,dur:1})).then(function(){
    if(stgReduced())return;
    var last=0;
    (function turn(t){
      if(!drag&&last){cam.yaw=yawWrap(cam.yaw+(t-last)*0.009);draw()}
      last=t; requestAnimationFrame(turn)})(0);
  });
})();
(function(){var q=_Q.get('made'); if(q&&ACC[q])setTimeout(function(){CP.made(q,0);
  try{if(!matchMedia('(prefers-reduced-motion: reduce)').matches)accPlay()}catch(e){accPlay()}},400)})();
(function(){var rv=document.getElementById('rev');
  if(rv&&window.CP&&CP.rev)rv.textContent='· '+CP.rev})();
var tLb=document.getElementById('tlb'),
    tTh=document.getElementById('tth');
if(tLb&&PUBLIC)tLb.style.display='none';
else if(tLb)tLb.addEventListener('click',function(){CP.partLabels(!LBL_ON)});
if(tTh)tTh.addEventListener('click',function(){
  var d=thT<0.5; tTh.classList.toggle('on',d); CP.theme(d?'dark':'light')});
var tMb=document.getElementById('tmb');
if(tMb)tMb.addEventListener('click',function(){
  var on=!document.body.classList.contains('mob');
  document.body.classList.toggle('mob',on);
  tMb.classList.toggle('on',on);
  draw();
  CP.mobile(on?true:'auto');
});
var bSw=document.getElementById('bsw');
bSw.addEventListener('click',function(){
  if(SW.on){ swingStop(); goTo(V[lastIdx],lastIdx); }
  else CP.swing();
});
